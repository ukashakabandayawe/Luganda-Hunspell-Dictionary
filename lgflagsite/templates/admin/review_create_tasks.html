{% extends "admin/base_site.html" %}

{% block content %}
  <h1>{{ title }}</h1>

  <p>Selected stems: {{ stems|length }}</p>

  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="action" value="{{ action_name }}" />
    <input type="hidden" name="apply" value="1" />

    {% for stem in stems %}
      <input type="hidden" name="_selected_action" value="{{ stem.pk }}" />
    {% endfor %}

    <fieldset class="module aligned">
      <div class="form-row">
        <label for="id_flag_ids">Flags</label>
        <select id="id_flag_ids" name="flag_ids" multiple size="18" style="min-width: 320px;" required>
          {% for f in flags %}
            <option value="{{ f.id }}">{{ f.code }}{% if f.description %} — {{ f.description|truncatechars:80 }}{% endif %}</option>
          {% endfor %}
        </select>
        <p class="help">Hold Ctrl (or Cmd) to select multiple flags.</p>
      </div>
    </fieldset>

    <div class="submit-row">
      <input type="submit" value="Create tasks" class="default" />
      <a href="..">Cancel</a>
    </div>
  </form>
{% endblock %}
