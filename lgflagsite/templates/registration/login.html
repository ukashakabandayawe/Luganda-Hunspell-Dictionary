{% extends "base.html" %}

{% block title %}Login · Luganda Flag Review{% endblock %}

{% block content %}
  <div class="card" style="max-width: 520px; margin: 0 auto;">
    <h2>Login</h2>
    <div class="muted">Use the account created by your admin.</div>

    <hr class="sep">

    {% if form.errors %}
      <ul class="flash"><li>Invalid username/password.</li></ul>
    {% endif %}

    <form method="post" action="{% url 'login' %}" class="stack">
      {% csrf_token %}
      <div>
        <label for="id_username" class="muted">Username</label>
        {{ form.username }}
      </div>
      <div>
        <label for="id_password" class="muted">Password</label>
        {{ form.password }}
      </div>
      <button class="btn primary" type="submit">Sign in</button>
      <input type="hidden" name="next" value="{{ next }}" />
    </form>
  </div>
{% endblock %}
